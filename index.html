<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>QA Automation Learning Roadmap</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="site-header">

    <div class="header-content">

        <span class="eyebrow">
            QA AUTOMATION
        </span>

        <h1>
            Python & Automation
            Learning Roadmap
        </h1>

        <p class="subtitle">
            A structured path from manual QA
            to automation testing.
        </p>

    </div>


    <div class="overall-progress">

        <span class="progress-label">
            OVERALL PROGRESS
        </span>

        <strong id="overallProgress">
            0%
        </strong>

        <div class="progress-bar">

            <div
                id="overallProgressBar"
                class="progress-fill"
            ></div>

        </div>

    </div>

</header>



<main>


    <section class="dashboard-controls">

        <div>

            <span class="section-label">
                ROADMAP
            </span>

            <h2>
                Learning progress
            </h2>

        </div>


        <div class="filters">

            <button
                class="filter-button active"
                data-filter="all"
            >
                ALL
            </button>

            <button
                class="filter-button"
                data-filter="not-started"
            >
                NOT STARTED
            </button>

            <button
                class="filter-button"
                data-filter="in-progress"
            >
                IN PROGRESS
            </button>

            <button
                class="filter-button"
                data-filter="done"
            >
                DONE
            </button>

        </div>

    </section>



    <div id="roadmap"></div>


</main>



<script src="script.js"></script>

</body>

</html>
